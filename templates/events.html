{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<h2>All Events</h2>

<a href="/add" class="btn btn-success mb-3">Add New Event</a>

<form method="GET" action="/events" class="row mb-3">

<div class="col-md-8">
<input type="text" name="search"
value="{{search}}"
placeholder="Search id, name, date, location"
class="form-control">
</div>

<div class="col-md-2">
<select name="size" class="form-select" onchange="this.form.submit()">

<option value="5" {% if size==5 %}selected{% endif %}>5</option>
<option value="10" {% if size==10 %}selected{% endif %}>10</option>
<option value="30" {% if size==30 %}selected{% endif %}>30</option>
<option value="40" {% if size==40 %}selected{% endif %}>40</option>

</select>
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100">Search</button>
</div>

</form>


<table class="table table-bordered table-striped text-center">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Name</th>
<th>Date</th>
<th>Location</th>
<th>Action</th>
</tr>
</thead>

<tbody>

{% for event in events %}
<tr>

<td>{{ event.id }}</td>
<td>{{ event.name }}</td>
<td>{{ event.date }}</td>
<td>{{ event.location }}</td>

<td>

<a href="/edit/{{ event.id }}" class="btn btn-warning btn-sm">
Edit
</a>

<a href="/delete/{{ event.id }}" class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>
{% endfor %}

</tbody>

</table>


<div class="mt-3">

{% if page > 1 %}

<a href="/events?page={{page-1}}&size={{size}}&search={{search}}"
class="btn btn-primary">
Previous
</a>

{% endif %}

<a href="/events?page={{page+1}}&size={{size}}&search={{search}}"
class="btn btn-primary">
Next
</a>

</div>

</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

{% endblock %}
